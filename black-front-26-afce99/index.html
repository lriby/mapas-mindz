<style>
:root {
  --chrome: rgba(255,255,255,.84); --chrome-line: rgba(0,0,0,.08); --chrome-text: #2a2a2e;
  --chrome-soft: rgba(0,0,0,.05); --muted: rgba(42,42,46,.55); --accent: #007AFF;
  --shadow: 0 6px 24px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
:root[data-theme="dark"] {
  --chrome: rgba(44,44,46,.84); --chrome-line: rgba(255,255,255,.1); --chrome-text: #ededed;
  --chrome-soft: rgba(255,255,255,.08); --muted: rgba(237,237,237,.55); --accent: #0A84FF;
  --shadow: 0 6px 24px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: #fff; font-family: var(--ui); -webkit-font-smoothing: antialiased; }

#vp { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: default;
      -webkit-user-select: none; user-select: none; }
#vp.panning, #vp.panning * { cursor: grabbing !important; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
#edges path { fill: none; stroke-linecap: round; stroke-linejoin: round; }

.topic { position: absolute; left: 0; top: 0; width: max-content; transform-origin: 50% 50%;
         display: flex; flex-direction: column; align-items: center; gap: 6px;
         font-family: var(--font); line-height: 1.3; border-radius: 5px; padding: 2px 3px; min-width: 20px; }
.topic.d0 { font-size: 18px; font-weight: 700; padding: 11px 18px; border-radius: 12px; min-width: 100px; }
.topic.d1 { font-size: 14px; font-weight: 500; }
.topic.d2 { font-size: 13px; font-weight: 400; }
.topic.bold { font-weight: 700; }
.topic.pad { padding: 7px 12px; border-radius: 8px; }
.topic.can { cursor: pointer; }
@media (hover: hover) { .topic.plain.can:hover { background: var(--hov); } }
.topic.hit::before, .topic.cur::before { content: ""; position: absolute; inset: -3px; border-radius: inherit;
         background: rgba(255,216,77,.5); z-index: -1; }
.topic.cur::before { background: rgba(255,216,77,.95); }
.row { display: flex; align-items: center; gap: 5px; max-width: 100%; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 2px; text-align: left; }
.d0 .text { max-width: 230px; text-align: center; }
.d1 .text, .d2 .text { max-width: 250px; }
.right .text { text-align: right; }
.fixed .text { max-width: none; flex: 1 1 auto; min-width: 0; }
.text.ph { opacity: .45; font-style: italic; font-weight: 400; }
.emoji { flex: none; }
.pic { display: block; border-radius: 6px; cursor: zoom-in; -webkit-user-drag: none; }
.ic { flex: none; width: 14px; height: 14px; padding: 0; margin: 0; border: 0; background: none;
      color: var(--ic); cursor: pointer; display: grid; place-items: center; border-radius: 4px; }
.ic svg { width: 13px; height: 13px; }
.ic::after { content: ""; position: absolute; width: 30px; height: 30px; } /* área de toque maior */
.ic { position: relative; }
.ic::after { left: -8px; top: -8px; }

.knob { position: absolute; left: 0; top: 0; width: 24px; height: 22px; display: grid; place-items: center; cursor: pointer; }
.knob i { display: block; box-sizing: border-box; width: 9px; height: 9px; border-radius: 50%;
          border: 1.6px solid var(--c); background: var(--bg); opacity: 0; transition: opacity .15s; }
.knob.hot i, .knob:hover i { opacity: 1; }
@media (hover: none) { .knob i { opacity: 1; } }
.knob b { display: none; min-width: 18px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--c); color: var(--bg);
          font: 700 9.5px/16px ui-rounded, "SF Pro Rounded", var(--ui); text-align: center; }
.knob.closed i { display: none; }
.knob.closed b { display: block; }

/* Barra de ferramentas */
.bar { position: fixed; top: 14px; right: 14px; display: flex; align-items: center; gap: 2px; padding: 4px;
       background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 14px; box-shadow: var(--shadow);
       -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); color: var(--chrome-text); z-index: 10; }
.bar button { width: 32px; height: 32px; border: 0; border-radius: 9px; background: none; color: inherit; cursor: pointer;
              display: grid; place-items: center; padding: 0; }
.bar button:hover { background: var(--chrome-soft); }
.bar button svg { width: 18px; height: 18px; }
.bar .sep { width: 1px; height: 20px; background: var(--chrome-line); margin: 0 4px; }
.bar .zoom { width: auto; min-width: 46px; padding: 0 4px; font: 500 12px var(--ui); font-variant-numeric: tabular-nums; color: var(--muted); }
.search { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px 0 9px; border-radius: 9px; background: var(--chrome-soft); }
.search svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
.search input { width: 150px; border: 0; outline: 0; background: none; color: inherit; font: 14px var(--ui); padding: 0; }
.search input::placeholder { color: var(--muted); }
.search .count { font: 500 12px var(--ui); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.search .count:empty { display: none; }

/* Nota */
.card { position: fixed; top: 64px; right: 14px; width: 360px; max-width: calc(100vw - 28px); max-height: calc(100vh - 92px);
        display: none; flex-direction: column; background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 16px;
        box-shadow: var(--shadow); color: var(--chrome-text); z-index: 11;
        -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.card.open { display: flex; }
.card header { display: flex; align-items: flex-start; gap: 8px; padding: 14px 12px 10px 18px; border-bottom: 1px solid var(--chrome-line); }
.card h2 { flex: 1; margin: 2px 0 0; font: 600 15px/1.35 var(--ui); white-space: pre-wrap; overflow-wrap: anywhere; }
.card button { flex: none; width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.card button:hover { background: var(--chrome-soft); }
.card .body { padding: 14px 18px 18px; overflow: auto; font: 14px/1.55 var(--ui); white-space: pre-wrap; overflow-wrap: anywhere;
              -webkit-user-select: text; user-select: text; }
.card a { color: var(--accent); }
@media (max-width: 600px) {
  .bar { left: 10px; right: 10px; top: 10px; justify-content: space-between; }
  .search { flex: 1; min-width: 0; }
  .search input { width: 100%; min-width: 0; }
  .bar .zoom, .bar .opt { display: none; }
  .card { top: auto; bottom: 10px; right: 10px; left: 10px; width: auto; max-width: none; max-height: 60vh; }
}

/* Imagem em tela cheia */
.lb { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.82); z-index: 20; cursor: zoom-out; }
.lb.open { display: grid; }
.lb img { max-width: 94vw; max-height: 94vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }

.hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 14px; border-radius: 12px;
        background: var(--chrome); border: 1px solid var(--chrome-line); box-shadow: var(--shadow); color: var(--muted);

.hint.gone { opacity: 0; }

/* Sem JavaScript (barra de espaço no Finder, prévia do WhatsApp no Mac): só a foto do mapa. */

.nojs .bar, .nojs .hint, .nojs #vp { display: none; }

    if (branches) { n.stub = svg.appendChild(document.createElementNS(SVGNS, "path")); n.stub.setAttribute("stroke-width", 1.6); }
    const k = document.createElement("div");
    k.className = "knob"; k.dataset.i = n.i; k.innerHTML = "<i></i><b></b>";
    k.querySelector("b").textContent = n.count > 99 ? "99+" : String(n.count);
    n.knob = k; stage.append(k);
    el.addEventListener("mouseenter", () => k.classList.add("hot"));
    el.addEventListener("mouseleave", () => k.classList.remove("hot"));
    refreshKnob(n);
  }
  paintNode(n);
}

function refreshKnob(n) { if (n.knob) n.knob.classList.toggle("closed", n.collapsed); }

function paintNode(n) {
  const r = n.raw, bg = bgColor(), el = n.el;
  const color = n.depth === 0 ? rootColor() : n.color;
  const fg = r.f != null ? onFill(r.f) : textColor();
  el.style.color = hex(fg);
  el.style.setProperty("--ic", hex(n.depth === 0 ? fg : n.color));
  el.style.setProperty("--hov", rgba(textColor(), 0.06));
  if (r.f != null) el.style.background = hex(r.f);
  else if (n.depth === 0) el.style.background = mix(bg, color, dark ? 0.22 : 0.08);
  else if (n.depth === 1 && S.boxes) el.style.background = mix(bg, color, dark ? 0.28 : 0.13);
  if (n.edge) n.edge.setAttribute("stroke", hex(n.color));
  if (n.stub) n.stub.setAttribute("stroke", hex(n.color));
  if (n.knob) { n.knob.style.setProperty("--c", hex(n.color)); n.knob.style.setProperty("--bg", hex(bg)); }
}

function paint() {
  dark = S.background === "dark" || (S.background === "auto" && darkQuery.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.body.style.background = hex(bgColor());
  for (const n of all) if (n.el) paintNode(n);
}

// ---------- Posições (mesma conta do app) ----------
const VGAP = d => d === 1 ? 22 : 9;
const HGAP = parentDepth => parentDepth === 0 ? 52 : 38;
const KNOB = 11, KNOB_R = 4.5;
const openKids = n => (n.depth > 0 && n.collapsed) ? [] : n.kids;

function visibleList() {
  const out = [];
  (function walk(n) { out.push(n); for (const k of openKids(n)) walk(k); })(root);
  return out;
}

function ensureElements(list) {
  const fresh = list.filter(n => !n.el);
  for (const n of fresh) makeEl(n);
  for (const n of fresh) { n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; } // mede tudo de uma vez
}

function computeTargets() {
  const heights = new Map();
  const sub = n => {
    if (heights.has(n)) return heights.get(n);
    const ks = openKids(n);
    let h = n.h;
    if (ks.length) h = Math.max(h, ks.reduce((s, k) => s + sub(k), 0) + VGAP(n.depth + 1) * (ks.length - 1));
    heights.set(n, h);
    return h;
  };
  const placeKids = (kids, p, side) => {
    if (!kids.length) return;
    const gap = VGAP(p.depth + 1), hg = HGAP(p.depth);
    const total = kids.reduce((s, k) => s + sub(k), 0) + gap * (kids.length - 1);
    let y = p.ty + p.h / 2 - total / 2;
    for (const k of kids) {
      const st = sub(k);
      k.tx = side === "right" ? p.tx + p.w + hg : p.tx - hg - k.w;
      k.ty = y + st / 2 - k.h / 2;
      placeKids(openKids(k), k, side);
      y += st + gap;
    }
  };
  root.tx = -root.w / 2; root.ty = -root.h / 2;
  placeKids(root.kids.filter(k => k.side === "right"), root, "right");
  placeKids(root.kids.filter(k => k.side === "left"), root, "left");
}

const knobAt = (n, x, y) => ({ x: n.side === "left" ? x - KNOB : x + n.w + KNOB, y: y + n.h / 2 });

// ---------- Desenho e animação ----------
const view = { x: 0, y: 0, z: 1 };
let shown = [];
let anim = 0;

function applyView() {
  stage.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`;
  zoomLabel.textContent = Math.round(view.z * 100) + "%";
}

const f1 = v => Math.round(v * 10) / 10;
function branchPath(sx, sy, ex, ey) {
  const s = ex >= sx ? 1 : -1, spine = sx + s * (10 - KNOB_R), dy = ey - sy;
  if (Math.abs(dy) < 1) return `M${f1(sx)} ${f1(sy)}L${f1(ex)} ${f1(ey)}`;
  const v = dy > 0 ? 1 : -1, r = Math.min(7, Math.abs(dy) / 2, Math.abs(spine - sx));
  return `M${f1(sx)} ${f1(sy)}L${f1(spine - s * r)} ${f1(sy)}Q${f1(spine)} ${f1(sy)} ${f1(spine)} ${f1(sy + v * r)}`
       + `L${f1(spine)} ${f1(ey - v * r)}Q${f1(spine)} ${f1(ey)} ${f1(spine + s * r)} ${f1(ey)}L${f1(ex)} ${f1(ey)}`;
}
function curvePath(sx, sy, ex, ey) {
  const m = (sx + ex) / 2;
  return `M${f1(sx)} ${f1(sy)}C${f1(m)} ${f1(sy)} ${f1(m)} ${f1(ey)} ${f1(ex)} ${f1(ey)}`;
}

function drawFrame() {
  for (const n of shown) {
    n.el.style.transform = `translate(${n.cx}px,${n.cy}px)` + (n.cs !== 1 ? ` scale(${n.cs})` : "");
    n.el.style.opacity = n.co;
    if (n.knob) {
      const k = knobAt(n, n.cx, n.cy);
      n.knob.style.transform = `translate(${k.x - 12}px,${k.y - 11}px)`;
      n.knob.style.opacity = n.co;
    }
    if (n.depth === 0) continue;
    const p = n.parent, right = n.side !== "left", s = right ? 1 : -1;
    const py = p.cy + p.h / 2;
    const viaKnob = p.depth > 0 && branches;
    let sx;
    if (viaKnob) sx = knobAt(p, p.cx, p.cy).x + s * KNOB_R;
    else if (p.depth === 0) sx = right ? p.cx + p.w - 2 : p.cx + 2;
    else sx = right ? p.cx + p.w + 1 : p.cx - 1;
    const half = n.w * n.cs / 2, mid = n.cx + n.w / 2;
    const ex = right ? mid - half - 1 : mid + half + 1, ey = n.cy + n.h / 2;
    n.edge.setAttribute("d", viaKnob ? branchPath(sx, py, ex, ey) : curvePath(sx, py, ex, ey));
    n.edge.style.opacity = n.co;
    if (n.stub) {
      const y = n.cy + n.h / 2, kx = knobAt(n, n.cx, n.cy).x;
      n.stub.setAttribute("d", `M${f1(right ? n.cx + n.w + 1 : n.cx - 1)} ${f1(y)}L${f1(kx + s * KNOB_R)} ${f1(y)}`);
      n.stub.style.opacity = n.co;
    }
  }
}

function setShown(n, on) {
  n.shown = on;
  const d = on ? "" : "none";
  n.el.style.display = d;
  if (n.edge) n.edge.style.display = d;
  if (n.stub) n.stub.style.display = d;
  if (n.knob) n.knob.style.display = d;
}

/// Recalcula o mapa e anima até lá. `keep`: tópico que não deve sair do lugar na tela.
/// `goal(view)`: ajusta a posição final da tela (centralizar, mostrar um resultado da busca).
function relayout(animate, keep, goal) {
  const before = keep ? { x: keep.tx, y: keep.ty } : null;
  const list = visibleList();
  ensureElements(list);
  computeTargets();
  const visible = new Set(list);
  for (const n of list) {
    n.gx = n.tx; n.gy = n.ty; n.go = 1; n.gs = 1;
    if (!n.shown) {
      const p = n.parent;
      if (p) { const k = knobAt(p, p.tx, p.ty); n.cx = k.x - n.w / 2; n.cy = k.y - n.h / 2; } else { n.cx = n.tx; n.cy = n.ty; }
      n.co = 0; n.cs = 0.2;
      setShown(n, true);
      shown.push(n);
    }
  }
  for (const n of shown) {
    if (visible.has(n)) continue;
    let a = n.parent;
    while (!visible.has(a)) a = a.parent;
    const k = knobAt(a, a.tx, a.ty);
    n.gx = k.x - n.w / 2; n.gy = k.y - n.h / 2; n.go = 0; n.gs = 0.2;
  }
  const target = { x: view.x, y: view.y, z: view.z };
  if (before) { target.x -= (keep.tx - before.x) * view.z; target.y -= (keep.ty - before.y) * view.z; }
  if (goal) goal(target);
  run(animate, target, list);
}

function run(animate, target, list) {
  cancelAnimationFrame(anim);
  const finish = () => {
    for (const n of shown) if (!list.includes(n)) setShown(n, false);
    shown = list.slice();
  };
  const from = shown.map(n => [n.cx, n.cy, n.co, n.cs]);
  const v0 = { ...view };
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (const n of shown) { n.cx = n.gx; n.cy = n.gy; n.co = n.go; n.cs = n.gs; }
    Object.assign(view, target);
    applyView(); drawFrame(); finish();
    return;
  }
  const t0 = performance.now(), dur = 300;
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), e = ease(t);
    shown.forEach((n, i) => {
      const f = from[i];
      n.cx = f[0] + (n.gx - f[0]) * e; n.cy = f[1] + (n.gy - f[1]) * e;
      n.co = f[2] + (n.go - f[2]) * e; n.cs = f[3] + (n.gs - f[3]) * e;
    });
    view.x = v0.x + (target.x - v0.x) * e; view.y = v0.y + (target.y - v0.y) * e; view.z = v0.z + (target.z - v0.z) * e;
    applyView(); drawFrame();
    if (t < 1) anim = requestAnimationFrame(step); else finish();
  };
  anim = requestAnimationFrame(step);
}

/// Só mexe na tela (os tópicos ficam onde estão).
function moveView(animate, goal) {
  for (const n of shown) { n.gx = n.cx; n.gy = n.cy; n.go = n.co; n.gs = n.cs; }
  const target = { ...view };
  goal(target);
  run(animate, target, shown.slice());
}

// ---------- Enquadrar ----------
const clampZoom = z => Math.min(3, Math.max(0.15, z));
const topSpace = () => (innerWidth <= 600 ? 60 : 64);

function fitGoal(target) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of visibleList()) {
    x0 = Math.min(x0, n.tx - 28); x1 = Math.max(x1, n.tx + n.w + 28);
    y0 = Math.min(y0, n.ty - 10); y1 = Math.max(y1, n.ty + n.h + 10);
  }
  const W = innerWidth, H = innerHeight - topSpace();
  const z = clampZoom(Math.min(1, Math.max(0.45, Math.min((W - 40) / (x1 - x0), (H - 30) / (y1 - y0)))));
  target.z = z;
  target.x = W / 2 - (x0 + x1) / 2 * z;
  target.y = topSpace() + H / 2 - (y0 + y1) / 2 * z;
  // Mapa maior que a tela: o tópico central continua visível.
  const m = 40, rx0 = target.x + root.tx * z, rx1 = target.x + (root.tx + root.w) * z;
  if (rx0 < m) target.x += m - rx0; else if (rx1 > W - m) target.x -= rx1 - (W - m);
  const ry0 = target.y + root.ty * z, ry1 = target.y + (root.ty + root.h) * z;
  if (ry0 < topSpace() + m) target.y += topSpace() + m - ry0; else if (ry1 > innerHeight - m) target.y -= ry1 - (innerHeight - m);
}

function zoomAt(cx, cy, factor) {
  const z = clampZoom(view.z * factor);
  view.x = cx - (cx - view.x) * (z / view.z);
  view.y = cy - (cy - view.y) * (z / view.z);
  view.z = z;
  applyView();
}

// ---------- Abrir e fechar ----------
function toggle(n) {
  n.collapsed = !n.collapsed;
  refreshKnob(n);
  relayout(true, n);
}

function setAll(collapsed) {
  for (const n of all) if (n.depth > 0 && n.kids.length) { n.collapsed = collapsed; refreshKnob(n); }
  relayout(true, null, collapsed ? fitGoal : null);
}

// ---------- Nota e imagem ----------
const card = document.getElementById("card"), cardTitle = document.getElementById("cardTitle"), cardBody = document.getElementById("cardBody");
function openNote(n) {
  cardTitle.textContent = (n.raw.e ? n.raw.e + " " : "") + (n.raw.t || "Nota");
  cardBody.textContent = "";
  for (const part of n.raw.n.split(/(https?:\/\/[^\s<>"]+)/g)) {
    if (/^https?:\/\//.test(part)) {
      const a = document.createElement("a");
      a.href = part; a.textContent = part; a.target = "_blank"; a.rel = "noopener noreferrer";
      cardBody.append(a);
    } else cardBody.append(part);
  }
  cardBody.scrollTop = 0;
  card.classList.add("open");
}
const closeNote = () => card.classList.remove("open");
document.getElementById("cardClose").onclick = closeNote;

const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg");
const openImage = src => { lbImg.src = src; lb.classList.add("open"); };
lb.onclick = () => lb.classList.remove("open");

// ---------- Busca ----------
const q = document.getElementById("q"), qcount = document.getElementById("qcount");
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const folded = all.map(n => fold(n.raw.t + "\n" + (n.raw.n || "")));
let hits = [], hitIndex = 0, searchTimer = 0;

function clearHits() { for (const n of hits) if (n.el) n.el.classList.remove("hit", "cur"); }
function runSearch() {
  clearHits();
  const term = fold(q.value.trim());
  hits = term ? all.filter(n => folded[n.i].includes(term)) : [];
  hitIndex = 0;
  if (!hits.length) { qcount.textContent = term ? "0" : ""; return; }
  for (const n of hits) for (let a = n.parent; a; a = a.parent) if (a.collapsed) { a.collapsed = false; refreshKnob(a); }
  showHit(true);
}
function showHit(relayoutFirst) {
  const n = hits[hitIndex];
  qcount.textContent = (hitIndex + 1) + "/" + hits.length;
  const goal = t => {
    const W = innerWidth, H = innerHeight - topSpace();
    t.x = W / 2 - (n.tx + n.w / 2) * t.z;
    t.y = topSpace() + H / 2 - (n.ty + n.h / 2) * t.z;
  };
  if (relayoutFirst) relayout(true, null, goal); else moveView(true, goal);
  for (const h of hits) { h.el.classList.add("hit"); h.el.classList.toggle("cur", h === n); }
}
q.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 160); });
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && hits.length) {
    e.preventDefault();
    hitIndex = (hitIndex + (e.shiftKey ? hits.length - 1 : 1)) % hits.length;
    showHit(false);
  } else if (e.key === "Escape") { q.value = ""; runSearch(); q.blur(); }
});

// ---------- Mouse, toque e teclado ----------
const pointers = new Map();
let drag = null, pinch = null, moved = false;

vp.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; }
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, ...view };
    drag = null; moved = true;
  }
  hideHint();
});
addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const z = clampZoom(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    view.x = mx - (pinch.mx - pinch.x) * (z / pinch.z);
    view.y = my - (pinch.my - pinch.y) * (z / pinch.z);
    view.z = z;
    applyView();
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) > 4) { moved = true; vp.classList.add("panning"); cancelAnimationFrame(anim); }
    if (moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }
  }
});
const pointerEnd = e => {
  if (!pointers.delete(e.pointerId)) return;
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 1) { const [p] = [...pointers.values()]; drag = { x: p.x, y: p.y, vx: view.x, vy: view.y }; }
  if (pointers.size === 0) { drag = null; vp.classList.remove("panning"); }
};
addEventListener("pointerup", pointerEnd);
addEventListener("pointercancel", pointerEnd);

// Depois de arrastar o mapa, o clique não abre nada.
vp.addEventListener("click", e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
vp.addEventListener("click", e => {
  const knob = e.target.closest(".knob");
  if (knob) { toggle(all[knob.dataset.i]); return; }
  const el = e.target.closest(".topic");
  if (!el) { closeNote(); return; }
  const n = all[el.dataset.i];
  if (e.target.closest(".note")) { openNote(n); return; }
  if (e.target.closest(".link")) return; // o próprio link abre numa aba nova
  if (e.target.closest(".pic")) { openImage(n.raw.img); return; }
  if (n.depth > 0 && n.kids.length) toggle(n);
});

vp.addEventListener("wheel", e => {
  e.preventDefault();
  hideHint();
  cancelAnimationFrame(anim);
  if (e.ctrlKey || e.metaKey) { zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.01))); return; }
  let dx = e.deltaX, dy = e.deltaY;
  if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
  if (e.shiftKey && !dx) { dx = dy; dy = 0; }
  view.x -= dx; view.y -= dy;
  applyView();
}, { passive: false });

// Safari no Mac: pinça no trackpad.
let gestureZoom = 1;
document.addEventListener("gesturestart", e => { e.preventDefault(); gestureZoom = view.z; });
document.addEventListener("gesturechange", e => {
  e.preventDefault();
  if (!pinch) zoomAt(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, clampZoom(gestureZoom * e.scale) / view.z);
});

const zoomLabel = document.getElementById("zoomLabel");
const zoomCenter = f => zoomAt(innerWidth / 2, (innerHeight + topSpace()) / 2, f);
document.getElementById("zoomIn").onclick = () => zoomCenter(1.25);
document.getElementById("zoomOut").onclick = () => zoomCenter(0.8);
zoomLabel.onclick = () => zoomCenter(1 / view.z);
document.getElementById("center").onclick = () => moveView(true, fitGoal);
document.getElementById("openAll").onclick = () => setAll(false);
document.getElementById("closeAll").onclick = () => setAll(true);

addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); q.focus(); q.select(); return; }
  if (e.key === "Escape") { lb.classList.remove("open"); closeNote(); return; }
  if (e.target === q || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "+" || e.key === "=") zoomCenter(1.25);
  else if (e.key === "-") zoomCenter(0.8);
  else if (e.key === "0") moveView(true, fitGoal);
  else if (e.key === "/") { e.preventDefault(); q.focus(); }
});

// ---------- Dica de uso ----------
const hint = document.getElementById("hint");
const touch = matchMedia("(hover: none)").matches;
hint.textContent = touch
  ? "Toque num tópico para abrir ou fechar · arraste para mover · dois dedos para zoom"
  : "Clique num tópico para abrir ou fechar · arraste para mover · pinça ou ⌘ + rolagem para zoom";
let hintTimer = setTimeout(hideHint, 7000);
function hideHint() { clearTimeout(hintTimer); hint.classList.add("gone"); }

// ---------- Início ----------
paint();
darkQuery.addEventListener("change", paint);
relayout(false, null, fitGoal);
addEventListener("resize", () => applyView());
})();
</script>
</body>
</html>
